[workspace]
resolver = "2"
members = [
    "crates/unibrowser-mod-api",
    "crates/unibrowser-engine",
    "crates/unibrowser-mod-host",
    "crates/unibrowser-project",
    "crates/unibrowser-media",
    "crates/unibrowser-script-host",
    "crates/unibrowser-app",
    "mods/base-text",
    "mods/base-png",
    "mods/base-svg",
    "mods/base-docx",
    "mods/base-pdf",
    "mods/base-dxf",
    "mods/base-js",
    "mods/base-video",
    "mods/base-audio",
    "mods/toy-markdown",
    "mods/base-files",
    "mods/base-web",
    "crates/unibrowser-desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/unibrowser/unibrowser"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = "1"
tracing = "0.1"

