[workspace]
resolver = "2"
members = [
    "crates/unibrowser-build-info",
    "crates/unibrowser-cli",
    "crates/unibrowser-mod-api",
    "crates/unibrowser-mod-sdk",
    "crates/unibrowser-engine",
    "crates/unibrowser-proofing",
    "crates/unibrowser-diagnostics",
    "crates/unibrowser-fs",
    "crates/unibrowser-live",
    "crates/unibrowser-ai-assistant",
    "crates/unibrowser-projections",
    "crates/unibrowser-mod-host",
    "crates/unibrowser-project",
    "crates/unibrowser-media",
    "crates/unibrowser-script-host",
    "crates/unibrowser-vsix",
    "crates/unibrowser-extension-host",
    "crates/unibrowser-docx",
    "crates/unibrowser-terminal",
    "crates/unibrowser-ocr",
    "crates/unibrowser-app",
    "mods/base-text",
    "mods/base-png",
    "mods/base-svg",
    "mods/base-docx",
    "mods/base-epub",
    "mods/base-csv",
    "mods/base-pdf",
    "mods/base-dxf",
    "mods/base-js",
    "mods/base-video",
    "mods/base-audio",
    "mods/base-hex",
    "mods/toy-markdown",
    "mods/base-files",
    "mods/spell-en-nz",
    "mods/grammar-harper",
    "mods/dxf-checker",
    "mods/unibrow-checker",
    "mods/live-proving",
    "mods/ai-assistant",
    "mods/cmd-proving",
    "mods/image-grayscale-preview",
    "mods/base-web",
    "crates/unibrowser-desktop/src-tauri",
    "examples/ub-mod-cdylib-stub",
    "examples/ub-mod-wasm",
    "crates/unibrowser-docx",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/unibrowser/unibrowser"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = "1"
tracing = "0.1"

