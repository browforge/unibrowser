name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm32 target (mod-host tests)
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/unibrowser-desktop/package-lock.json
      - name: Install Linux deps (Tauri + egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-0 libssl-dev
      - name: npm install (desktop UI)
        working-directory: crates/unibrowser-desktop
        run: npm ci
      - name: npm build (desktop UI)
        working-directory: crates/unibrowser-desktop
        run: npm run build
      - name: Build media sidecar (LGPL T3 helper)
        run: cargo build -p unibrowser-media --bin unibrowser-media-sidecar
      - name: cargo test
        run: cargo test --workspace
      - name: cargo build Tauri (debug)
        run: |
          cargo build -p unibrowser-media --bin unibrowser-media-sidecar
          cargo build -p unibrowser-desktop
      - name: cargo build egui spike
        run: cargo build -p unibrowser-app
      - name: Install Linux bundle deps
        run: |
          sudo apt-get install -y fuse libfuse2 patchelf
      - name: Tauri bundle (deb + AppImage)
        working-directory: crates/unibrowser-desktop
        run: |
          cargo build -p unibrowser-media --bin unibrowser-media-sidecar --release
          npm run tauri build
          du -sh ../../../target/release/bundle/deb/*.deb ../../../target/release/bundle/appimage/*.AppImage 2>/dev/null || true
      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  windows-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: cargo check (Windows MSVC, engine + mods)
        run: cargo check --workspace --exclude unibrowser-desktop --target x86_64-pc-windows-msvc

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm32 target (mod-host wasm tests)
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/unibrowser-desktop/package-lock.json
      - name: npm install (desktop UI)
        working-directory: crates/unibrowser-desktop
        run: npm ci
      - name: npm build (desktop UI)
        working-directory: crates/unibrowser-desktop
        run: npm run build
      - name: Build media sidecar
        run: cargo build -p unibrowser-media --bin unibrowser-media-sidecar
      - name: Stage media sidecar for Tauri (debug)
        shell: pwsh
        run: |
          $destDir = "crates/unibrowser-desktop/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          Copy-Item -Force "target/debug/unibrowser-media-sidecar.exe" `
            "$destDir/unibrowser-media-sidecar-x86_64-pc-windows-msvc.exe"
      - name: cargo test
        run: cargo test --workspace --exclude unibrowser-desktop --exclude ub-mod-wasm
      - name: cargo build Tauri (debug)
        run: cargo build -p unibrowser-desktop
      - name: Tauri bundle (NSIS + MSI)
        working-directory: crates/unibrowser-desktop
        run: |
          cargo build -p unibrowser-media --bin unibrowser-media-sidecar --release
          npm run tauri build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: warn
