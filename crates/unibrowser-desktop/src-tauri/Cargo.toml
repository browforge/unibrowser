[package]
name = "unibrowser-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unibrowser Tauri shell"
authors = ["Unibrowser contributors"]

[features]
default = ["dynamic-mods"]
dynamic-mods = ["unibrowser-mod-host/dynamic-mods"]

[lib]
name = "unibrowser_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
unibrowser-engine = { path = "../../unibrowser-engine" }
unibrowser-mod-host = { path = "../../unibrowser-mod-host", features = ["dynamic-mods"] }
unibrowser-build-info = { path = "../../unibrowser-build-info" }
unibrowser-mod-api = { path = "../../unibrowser-mod-api" }
base-files = { path = "../../../mods/base-files" }
base-web = { path = "../../../mods/base-web" }
base-text = { path = "../../../mods/base-text" }
base-png = { path = "../../../mods/base-png" }
base-svg = { path = "../../../mods/base-svg" }
base-docx = { path = "../../../mods/base-docx" }
base-pdf = { path = "../../../mods/base-pdf" }
base-dxf = { path = "../../../mods/base-dxf" }
base-js = { path = "../../../mods/base-js" }
base-video = { path = "../../../mods/base-video" }
base-audio = { path = "../../../mods/base-audio" }
unibrowser-script-host = { path = "../../unibrowser-script-host" }
toy-markdown = { path = "../../../mods/toy-markdown" }
unibrowser-project = { path = "../../unibrowser-project" }
unibrowser-media = { path = "../../unibrowser-media" }
unibrowser-vsix = { path = "../../unibrowser-vsix" }
unibrowser-extension-host = { path = "../../unibrowser-extension-host" }
url = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
urlencoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = "2.0"
gio = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
