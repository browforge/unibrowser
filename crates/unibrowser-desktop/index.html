<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unibrowser</title>
  </head>
  <body>
    <header id="chrome">
      <div id="mods-line" class="mods-line"></div>
      <div id="bookmark-bar" class="bookmark-bar" aria-label="Pinned places"></div>
      <div id="tab-strip" class="tab-strip" role="tablist" aria-label="Open tabs"></div>
      <div class="nav-row">
        <button type="button" id="btn-back" title="Back">←</button>
        <button type="button" id="btn-forward" title="Forward">→</button>
        <button type="button" id="btn-reload" title="Reload">↻</button>
        <div class="omnibox-wrap">
          <input id="omnibox" type="text" placeholder="file://, https://, or path" autocomplete="off" />
          <div id="omnibox-suggestions" class="omnibox-suggestions hidden" role="listbox"></div>
        </div>
        <button type="button" id="btn-tab-search" title="Search open tabs (Ctrl+Shift+T)">Tabs</button>
        <button type="button" id="btn-split" title="Experimental: vertical split, two tabs side by side (Shift+click tab)">Split</button>
        <button type="button" id="btn-mod-portal" title="Browse and install mods">Mods</button>
        <button type="button" id="btn-new-project" title="Create a .unibrow project folder">New project</button>
        <button type="button" id="btn-theme" title="Cycle light / dark / system theme">Theme</button>
        <button type="button" id="btn-compare" title="Compare with another file">Compare</button>
        <button type="button" id="btn-pin" title="Pin this page">Pin</button>
        <button type="button" id="btn-recent" class="muted" title="Recent files (optional)">Recent</button>
        <button type="button" id="btn-demo-download" class="muted" title="Simulate download → new tab">
          Demo download
        </button>
      </div>
      <div id="recent-panel" class="recent-panel hidden" aria-label="Recent files"></div>
      <section id="command-manager" class="command-manager" aria-label="Command manager">
        <div class="command-manager-header">
          <div
            id="command-manager-tabs"
            class="command-manager-tabs"
            role="tablist"
            aria-label="Command manager phases"
          ></div>
          <div class="cm-pin-wrap">
            <span id="command-manager-pin-label" class="cm-pin-label">Commands follow document</span>
            <button
              type="button"
              id="command-manager-pin"
              class="cm-pin"
              title="Pin the commands tab (stop following document context)"
            >
              Pin commands tab
            </button>
          </div>
          <button type="button" id="command-manager-export" class="cm-layout-btn">
            Export layout
          </button>
          <button type="button" id="command-manager-import" class="cm-layout-btn">
            Import layout
          </button>
        </div>
        <div id="command-manager-commands" class="command-manager-commands"></div>
      </section>
      <div id="floating-toolbar-host" class="floating-toolbar-host"></div>
      <div id="toast-host" class="toast-host hidden" role="status" aria-live="polite"></div>
    </header>
    <div id="onboarding-banner" class="onboarding-banner hidden" role="status">
      <span>Tip: Ctrl+Shift+P opens the command palette. Dismiss this any time.</span>
      <button type="button" id="onboarding-dismiss">Dismiss</button>
    </div>
    <div id="onboarding-tour" class="onboarding-tour hidden" aria-live="polite"></div>
    <main id="content-host" class="content-host">
      <div id="new-tab-page-host" class="new-tab-page-host hidden" aria-label="Start page"></div>
      <div id="split-primary" class="split-pane">
        <div id="files-browser-wrap" class="files-browser-wrap panel hidden">
          <div id="files-panel" class="files-panel-main"></div>
          <aside id="files-side-panel" class="files-side-panel hidden" aria-label="Files actions"></aside>
        </div>
        <div id="diff-editor-host" class="diff-editor-host hidden"></div>
        <div id="image-compare-host" class="image-compare-host hidden" aria-label="Image compare"></div>
        <div id="text-editor-host" class="text-editor-host hidden"></div>
        <div id="document-viewer-host" class="document-viewer-host hidden"></div>
        <div id="mod-portal-panel" class="panel mod-portal hidden"></div>
        <div id="doc-panel" class="panel doc-panel"></div>
      </div>
      <div id="split-secondary" class="split-pane split-secondary hidden">
        <div id="split-text-editor-host" class="text-editor-host hidden"></div>
        <div id="split-document-viewer-host" class="document-viewer-host hidden"></div>
        <div id="split-doc-panel" class="panel doc-panel hidden"></div>
      </div>
    </main>
    <aside id="script-output-panel" class="script-output-panel hidden" aria-label="Script output">
      <div class="script-output-head">
        <span>Script output</span>
        <button type="button" id="script-output-close" aria-label="Close script output">×</button>
      </div>
      <div id="script-output-log" class="script-output-log"></div>
    </aside>
    <footer id="status-bar" class="status-bar" aria-label="Status">
      <span id="status-path" class="status-segment status-path"></span>
      <span id="status-context" class="status-segment status-context muted"></span>
      <span id="status-dirty" class="status-segment status-dirty" aria-label="Unsaved changes"></span>
      <span id="status-encoding" class="status-segment"></span>
      <span id="status-cursor" class="status-segment"></span>
      <span id="status-font" class="status-segment"></span>
      <span class="status-zoom-controls">
        <button type="button" id="status-zoom-out" class="status-zoom-btn hidden" title="Zoom out">−</button>
        <span id="status-zoom-label" class="status-segment"></span>
        <button type="button" id="status-zoom-in" class="status-zoom-btn hidden" title="Zoom in">+</button>
      </span>
      <span id="status-encode" class="status-segment status-encode muted"></span>
      <span id="status-hint" class="status-hint"></span>
    </footer>
    <div id="tab-search" class="palette hidden" role="dialog" aria-label="Search open tabs">
      <input id="tab-search-query" type="text" placeholder="Filter open tabs…" />
      <div id="tab-search-results"></div>
    </div>
    <div id="document-find-bar" class="document-find-bar hidden" role="search">
      <label class="document-find-label" for="document-find-input">Find</label>
      <input id="document-find-input" type="search" autocomplete="off" spellcheck="false" />
      <button type="button" id="document-find-prev" title="Previous match">Prev</button>
      <button type="button" id="document-find-next" title="Next match">Next</button>
      <button type="button" id="document-find-close" title="Close find">Close</button>
    </div>
    <div id="palette" class="palette hidden" role="dialog" aria-modal="true" aria-label="Command palette">
      <input id="palette-query" type="text" placeholder="Search commands (Ctrl+Shift+P)" aria-label="Search commands" />
      <div id="palette-results"></div>
    </div>
    <div
      id="keys-shortcuts-overlay"
      class="palette keys-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Keyboard shortcuts"
    >
      <input
        id="keys-shortcuts-query"
        type="search"
        autocomplete="off"
        spellcheck="false"
        aria-label="Filter keyboard shortcuts"
      />
      <div id="keys-shortcuts-results" class="keys-shortcuts-results"></div>
    </div>
    <div id="workspace-quick-open" class="palette hidden" role="dialog" aria-label="Go to file in workspace">
      <div class="filename-search-head">
        <input id="workspace-quick-open-query" type="search" placeholder="File name in workspace…" autocomplete="off" />
        <button type="button" id="workspace-quick-open-close">Close</button>
      </div>
      <p id="workspace-quick-open-hint" class="viewer-note filename-search-root-label"></p>
      <div id="workspace-quick-open-results"></div>
    </div>
    <div id="filename-search" class="palette hidden" role="dialog" aria-label="Find files">
      <div class="filename-search-head">
        <input id="filename-search-query" type="search" placeholder="Filename…" />
        <button type="button" id="filename-search-cancel">Cancel search</button>
        <button type="button" id="filename-search-close">Close</button>
      </div>
      <label class="filename-search-root-label">
        Search under
        <input id="filename-search-root" type="text" class="files-search-input" />
      </label>
      <div id="filename-search-results"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
