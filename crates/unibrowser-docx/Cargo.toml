[package]
name = "unibrowser-docx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lite DOCX save from HTML subset (paragraph/heading/bold/italic)"

[dependencies]
docx-rs = "0.4"
quick-xml = { version = "0.37", features = ["serialize"] }
scraper = "0.22"
serde = { workspace = true, features = ["derive"] }
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
unibrowser-document-model = { path = "../unibrowser-document-model" }

[dev-dependencies]
proptest = "1"
scraper = "0.22"
