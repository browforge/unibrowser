[package]
name = "unibrowser-web-host"
description = "WASM host session for static web build (engine + invoke router)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
unibrowser-engine = { path = "../unibrowser-engine" }
unibrowser-mod-api = { path = "../unibrowser-mod-api" }
unibrowser-platform = { path = "../unibrowser-platform" }
base-text = { path = "../../mods/base-text" }
unibrowser-document-model = { path = "../unibrowser-document-model" }
base64 = "0.22"
toy-markdown = { path = "../../mods/toy-markdown" }

[dev-dependencies]
wasm-bindgen-test = "0.3"
