[package]
name = "unibrowser-diagnostics"
description = "Generic diagnostics host, LSP client, locators, dictionary store"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "unibrowser-lsp-stub"
path = "src/bin/lsp_stub_server.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
dxf-checker = { path = "../../mods/dxf-checker" }
unibrow-checker = { path = "../../mods/unibrow-checker" }
