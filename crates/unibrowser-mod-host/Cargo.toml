[package]
name = "unibrowser-mod-host"
description = "Mod manifest loader and bundled mod registration"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
unibrowser-mod-api = { path = "../unibrowser-mod-api" }
unibrowser-engine = { path = "../unibrowser-engine" }
base-text = { path = "../../mods/base-text" }
base-png = { path = "../../mods/base-png" }
toy-markdown = { path = "../../mods/toy-markdown" }
base-files = { path = "../../mods/base-files" }
base-web = { path = "../../mods/base-web" }
base-svg = { path = "../../mods/base-svg" }
base-docx = { path = "../../mods/base-docx" }
base-pdf = { path = "../../mods/base-pdf" }
base-dxf = { path = "../../mods/base-dxf" }
base-js = { path = "../../mods/base-js" }
base-video = { path = "../../mods/base-video" }
base-audio = { path = "../../mods/base-audio" }
base-hex = { path = "../../mods/base-hex" }
base-epub = { path = "../../mods/base-epub" }
base-csv = { path = "../../mods/base-csv" }
spell-en-nz = { path = "../../mods/spell-en-nz" }
grammar-harper = { path = "../../mods/grammar-harper" }
dxf-checker = { path = "../../mods/dxf-checker" }
unibrow-checker = { path = "../../mods/unibrow-checker" }
live-proving = { path = "../../mods/live-proving" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
libloading = { version = "0.8", optional = true }
wasmi = { version = "0.40", optional = true }

[dev-dependencies]
crc32fast = "1"
ai-assistant = { path = "../../mods/ai-assistant" }
cmd-proving = { path = "../../mods/cmd-proving" }

[features]
default = ["wasm-mods"]
dynamic-mods = ["dep:libloading"]
wasm-mods = ["dep:wasmi"]
