<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#20252c}.s{font-size:12px}.m{font-size:13px}.h{font-size:16px;font-weight:600}.title{font-size:20px;font-weight:650}
    .line{stroke:#c9cfd7}.panel{fill:#fff}.chrome{fill:#eceff3}.soft{fill:#f4f5f7}.accent{fill:#1769aa}.muted{fill:#707a87}.card{fill:#fff;stroke:#c9cfd7}
  </style>
  <rect width="1280" height="800" class="soft"/>
  <rect width="1280" height="32" class="chrome"/><text x="14" y="21" class="s">File   Edit   View   Go   Tools   Help</text><text x="1160" y="21" class="s">Unibrowser          </text>
  <rect y="32" width="1280" height="34" class="chrome"/><rect x="8" y="36" width="150" height="30" class="panel"/><rect x="8" y="36" width="150" height="2" class="accent"/><text x="31" y="56" class="m">Settings</text><text x="140" y="56" class="s"> </text><rect x="165" y="36" width="180" height="30" class="chrome"/><text x="184" y="56" class="m">Mod Portal</text><text x="328" y="56" class="s"> </text><text x="360" y="56" class="h">+</text>
  <rect y="66" width="1280" height="40" class="panel"/><text x="15" y="91" class="h">9  :</text><rect x="70" y="72" width="1050" height="28" rx="4" class="chrome"/><text x="88" y="91" class="m">Settings</text><text x="1150" y="91" class="m">     </text>
  <rect x="80" y="130" width="1120" height="622" rx="8" class="panel"/>
  <rect x="80" y="130" width="230" height="622" rx="8" class="chrome"/><text x="104" y="170" class="title">Settings</text><rect x="100" y="188" width="190" height="32" rx="4" class="panel"/><text x="114" y="209" class="s muted">Search settings</text>
  <rect x="96" y="238" width="198" height="32" rx="4" fill="#dceeff"/><text x="112" y="259" class="m" font-weight="600">General</text><text x="112" y="299" class="m">Appearance</text><text x="112" y="339" class="m">Files &amp; downloads</text><text x="112" y="379" class="m">Editing</text><text x="112" y="419" class="m">Accessibility</text><text x="112" y="459" class="m">Privacy &amp; AI</text><text x="112" y="499" class="m">Mods</text><text x="112" y="539" class="m">Keybindings</text><line x1="100" y1="566" x2="290" y2="566" class="line"/><text x="112" y="599" class="m">Developer</text><text x="270" y="599" class="m">:</text>
  <text x="346" y="174" class="title">General</text><text x="346" y="206" class="m muted">Everyday behaviour and startup.</text>
  <line x1="346" y1="230" x2="1160" y2="230" class="line"/><text x="346" y="262" class="m" font-weight="600">On startup</text><text x="346" y="284" class="s muted">Continue where you left off</text><rect x="940" y="244" width="200" height="32" rx="4" class="chrome"/><text x="956" y="265" class="m">Restore previous tabs   </text>
  <line x1="346" y1="310" x2="1160" y2="310" class="line"/><text x="346" y="342" class="m" font-weight="600">Downloads</text><text x="346" y="364" class="s muted">Open completed downloads in a new tab</text><rect x="1090" y="330" width="44" height="24" rx="12" class="accent"/><circle cx="1122" cy="342" r="9" fill="#fff"/>
  <line x1="346" y1="390" x2="1160" y2="390" class="line"/><text x="346" y="422" class="m" font-weight="600">Workspace</text><text x="346" y="444" class="s muted">Follow the active content unless pinned</text><rect x="940" y="404" width="200" height="32" rx="4" class="chrome"/><text x="956" y="425" class="m">Follow content   </text>
  <line x1="346" y1="470" x2="1160" y2="470" class="line"/><text x="346" y="502" class="m" font-weight="600">Autosave</text><text x="346" y="524" class="s muted">Keep local recovery copies every 5 minutes</text><rect x="940" y="484" width="200" height="32" rx="4" class="chrome"/><text x="956" y="505" class="m">5 minutes   </text>
  <rect x="346" y="574" width="794" height="112" rx="6" class="chrome"/><text x="366" y="604" class="h">Developer tools are quiet by default</text><text x="366" y="630" class="s">Loaded mods, demo actions, capture diagnostics and layout JSON live in Developer.</text><text x="366" y="654" class="s">They never occupy primary chrome.</text><text x="1030" y="654" class="s" fill="#1769aa">Open Developer</text>
  <rect y="752" width="1280" height="24" class="chrome"/><text x="12" y="769" class="s">Settings apply immediately</text><text x="1130" y="769" class="s">100%</text>
  <rect y="776" width="1280" height="24" fill="#20252c"/><text x="12" y="793" class="s" fill="#fff">1280   800   Settings tab   Developer depth is available, not dominant</text>
