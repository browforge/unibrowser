<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#20252c}.h{font-size:24px;font-weight:650}.t{font-size:15px;font-weight:600}.s{font-size:11px}.card{fill:#fff;stroke:#c9cfd7;stroke-width:1}.chrome{fill:#e2e6eb}.side{fill:#dceeff}.content{fill:#f4f5f7}.bottom{fill:#dfe7df}.live{fill:#c21e32}
  </style>
  <rect width="1600" height="1000" fill="#f4f5f7"/><text x="40" y="48" class="h">Unibrowser context layout matrix</text><text x="40" y="76" class="s">Stable chrome; panels dock and push content. Miniatures show region assignment, not final content detail.</text>
  <!-- card helper pattern: title, chrome bars, body regions -->
  <g transform="translate(40 110)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">New tab</text><rect y="34" width="360" height="42" class="chrome"/><rect x="16" y="92" width="328" height="128" rx="6" class="content"/><rect x="44" y="116" width="96" height="34" rx="4" fill="#1769aa"/><text x="73" y="138" class="s" fill="#fff">Open</text><rect x="150" y="116" width="120" height="34" rx="4" class="card"/><text x="176" y="138" class="s">New project</text><text x="44" y="181" class="s">Recent work</text></g>
  <g transform="translate(420 110)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">File browser</text><rect y="34" width="360" height="42" class="chrome"/><rect x="0" y="76" width="82" height="144" class="side"/><rect x="82" y="76" width="190" height="144" class="content"/><rect x="272" y="76" width="88" height="144" class="side"/><text x="10" y="99" class="s">Favourites</text><text x="98" y="99" class="s">Folder list / grid</text><text x="283" y="99" class="s">Preview</text></g>
  <g transform="translate(800 110)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">Web page</text><rect y="34" width="360" height="42" class="chrome"/><rect x="12" y="88" width="336" height="132" class="content"/><text x="130" y="154" class="s">Web content</text><text x="14" y="69" class="s">Omnibox   Find   Download</text></g>
  <g transform="translate(1180 110)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">Text / DOCX</text><rect y="34" width="360" height="42" class="chrome"/><rect x="0" y="76" width="78" height="110" class="side"/><rect x="78" y="76" width="194" height="110" class="content"/><rect x="272" y="76" width="88" height="110" class="side"/><rect y="186" width="360" height="34" class="bottom"/><text x="12" y="99" class="s">Outline</text><text x="139" y="130" class="s">Editor</text><text x="293" y="99" class="s">AI</text><text x="140" y="208" class="s">Problems</text></g>
  <g transform="translate(40 370)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">Image</text><rect y="34" width="360" height="42" class="chrome"/><rect x="0" y="76" width="72" height="144" class="side"/><rect x="72" y="76" width="200" height="144" fill="#cfd5dc"/><rect x="272" y="76" width="88" height="144" class="side"/><text x="14" y="99" class="s">History</text><text x="148" y="151" class="s">Canvas</text><text x="282" y="99" class="s">Adjust</text></g>
  <g transform="translate(420 370)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">PDF</text><rect y="34" width="360" height="42" class="chrome"/><rect x="0" y="76" width="76" height="144" class="side"/><rect x="76" y="76" width="196" height="144" fill="#d5d9de"/><rect x="112" y="88" width="124" height="120" class="card"/><rect x="272" y="76" width="88" height="144" class="side"/><text x="14" y="99" class="s">Pages</text><text x="291" y="99" class="s">Notes</text></g>
  <g transform="translate(800 370)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">DXF drawing</text><rect y="34" width="360" height="42" class="chrome"/><rect x="0" y="76" width="78" height="144" class="side"/><rect x="78" y="76" width="194" height="144" fill="#202329"/><path d="M100 190 L150 105 L220 170 L250 98" fill="none" stroke="#69b7f2" stroke-width="2"/><rect x="272" y="76" width="88" height="144" class="side"/><text x="14" y="99" class="s">Layers</text><text x="282" y="99" class="s">Properties</text></g>
  <g transform="translate(1180 370)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">Video timeline</text><rect y="34" width="360" height="42" class="chrome"/><rect x="0" y="76" width="78" height="90" class="side"/><rect x="78" y="76" width="194" height="90" fill="#202329"/><rect x="272" y="76" width="88" height="90" class="side"/><rect y="166" width="360" height="54" class="bottom"/><rect x="16" y="182" width="110" height="18" fill="#69b7f2"/><rect x="130" y="182" width="82" height="18" fill="#e2a64e"/><text x="12" y="99" class="s">Sources</text><text x="141" y="124" class="s" fill="#fff">Preview</text><text x="282" y="99" class="s">Inspector</text></g>
  <g transform="translate(40 630)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">Live studio</text><rect y="34" width="360" height="42" class="chrome"/><rect x="0" y="76" width="82" height="100" class="side"/><rect x="82" y="76" width="190" height="100" fill="#202329"/><rect x="94" y="86" width="55" height="20" rx="3" class="live"/><text x="106" y="100" class="s" fill="#fff">LIVE</text><rect x="272" y="76" width="88" height="100" class="side"/><rect y="176" width="360" height="44" class="bottom"/><text x="11" y="99" class="s">Sources</text><text x="285" y="99" class="s">Props</text><text x="151" y="201" class="s">Mixer</text></g>
  <g transform="translate(420 630)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">Settings</text><rect y="34" width="360" height="42" class="chrome"/><rect x="0" y="76" width="94" height="144" class="side"/><rect x="94" y="76" width="266" height="144" class="content"/><text x="14" y="99" class="s">Categories</text><text x="112" y="102" class="s">Searchable setting rows</text><line x1="112" y1="120" x2="338" y2="120" stroke="#c9cfd7"/><line x1="112" y1="151" x2="338" y2="151" stroke="#c9cfd7"/><line x1="112" y1="182" x2="338" y2="182" stroke="#c9cfd7"/></g>
  <g transform="translate(800 630)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">Mod Portal</text><rect y="34" width="360" height="42" class="chrome"/><rect x="12" y="88" width="336" height="34" rx="4" class="card"/><text x="24" y="109" class="s">Search support and mods</text><rect x="12" y="134" width="336" height="70" rx="6" class="card"/><rect x="24" y="147" width="40" height="40" rx="6" class="side"/><text x="76" y="157" class="s" font-weight="600">CAD file support</text><text x="76" y="177" class="s">Apache-2.0   local files</text><rect x="284" y="151" width="52" height="26" rx="4" fill="#1769aa"/><text x="295" y="168" class="s" fill="#fff">Install</text></g>
  <g transform="translate(1180 630)"><rect width="360" height="238" rx="8" class="card"/><text x="14" y="24" class="t">Wide-screen rule</text><rect y="34" width="360" height="42" class="chrome"/><rect x="0" y="76" width="82" height="144" class="side"/><rect x="82" y="76" width="190" height="144" class="content"/><rect x="272" y="76" width="88" height="144" class="side"/><text x="12" y="99" class="s">Left dock</text><text x="124" y="149" class="s">e 480 px content</text><text x="285" y="99" class="s">Right dock</text><text x="97" y="205" class="s">At 1280, close/replace a sidebar before content starves.</text></g>
  <text x="40" y="930" class="s">1280 reference: one or two docks only while content remains e480 px. Wide reference: both sidebars and bottom panel supported.</text>
  <text x="40" y="956" class="s">Every context retains tabs, navigation, Command Manager frame and status. No supporting surface floats over content.</text>
</svg>
